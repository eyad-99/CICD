name: Build and deploy CICD to EyadAzure

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: EyadAzure
  AZURE_WEBAPP_PACKAGE_PATH: ./publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: CICD

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"

      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build

      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" `
          --configuration ${{ env.CONFIGURATION }} `
          --no-build `
          --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Show published files
        run: dir "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: windows-latest
    needs: build

    environment:
      name: EyadAzure_Env

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Show downloaded files
        run: dir "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Install Web Deploy
        shell: powershell
        run: |
          choco install webdeploy -y --no-progress

      - name: Deploy using MSDeploy
        shell: powershell
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          $profilePath = "$env:RUNNER_TEMP\publish.publishsettings"

          [System.IO.File]::WriteAllText(
            $profilePath,
            $env:PUBLISH_PROFILE
          )

          [xml]$profile = Get-Content $profilePath

          $publishProfile = $profile.publishData.publishProfile |
            Where-Object { $_.publishMethod -eq "MSDeploy" } |
            Select-Object -First 1

          if (-not $publishProfile) {
            throw "MSDeploy publish profile was not found."
          }

          Write-Host "MSDeploy URL:"
          Write-Host $publishProfile.publishUrl

          Write-Host "IIS Application:"
          Write-Host $publishProfile.IISApp

          $msdeploy = "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (-not (Test-Path $msdeploy)) {
            throw "msdeploy.exe was not found at $msdeploy"
          }

          & $msdeploy `
            -verb:sync `
            "-source:contentPath=${{ env.AZURE_WEBAPP_PACKAGE_PATH }}" `
            "-dest:auto,ComputerName=$($publishProfile.publishUrl),UserName=$($publishProfile.userName),Password=$($publishProfile.userPWD),AuthType=Basic" `
            "-setParam:name='IIS Web Application Name',value='$($publishProfile.IISApp)'"

          if ($LASTEXITCODE -ne 0) {
            throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

